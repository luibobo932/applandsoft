name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend production, vi du https://landsoft-api.example.com/api/v1"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}
      # Tai khoan mo san (menu 3 gach). Dat o Settings > Secrets > QUICK_ACCOUNTS,
      # dang JSON: [{"username":"SKL-xxx","password":"...","label":"Ten"}]
      # Khong dat secret nay thi APK ra doi hoi dang nhap tay 1 lan — van dung binh thuong.
      EXPO_PUBLIC_QUICK_ACCOUNTS: ${{ secrets.QUICK_ACCOUNTS }}
      NODE_ENV: production

    steps:
      - name: Lay source
        uses: actions/checkout@v4

      - name: Kiem tra backend production
        shell: bash
        run: |
          set -euo pipefail
          case "$EXPO_PUBLIC_API_BASE_URL" in
            http://*/api/v1|https://*/api/v1) ;;
            *) echo "api_base_url phai ket thuc bang /api/v1"; exit 1 ;;
          esac
          SERVER_ROOT="${EXPO_PUBLIC_API_BASE_URL%/api/v1}"
          curl --fail --silent --show-error --retry 3 "$SERVER_ROOT/health"
          curl --fail --silent --show-error --retry 3 "$SERVER_ROOT/ready"

      - name: Cai Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Cai Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cai dependencies va kiem tra TypeScript
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck
          npm test

      # Keystore rieng: dat 4 secret ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
      # ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD thi APK duoc ky bang chu ky that.
      # Chua dat thi van build duoc (ky bang debug keystore nhu truoc).
      - name: Chuan bi keystore ky APK
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/landsoft-release.jks"
            echo "path=$RUNNER_TEMP/landsoft-release.jks" >> "$GITHUB_OUTPUT"
            echo "APK se duoc ky bang keystore rieng."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "Chua co ANDROID_KEYSTORE_BASE64 -> ky bang debug keystore."
          fi

      - name: Build APK release
        working-directory: mobile/android
        env:
          LANDSOFT_STORE_FILE: ${{ steps.keystore.outputs.path }}
          LANDSOFT_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LANDSOFT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LANDSOFT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          # LUU Y: bieu thuc cua GitHub Actions khong lam duoc phep cong, va cung dung
          # viet cap ngoac nhon kep trong ghi chu — GitHub van coi do la bieu thuc va
          # bao hong ca file workflow. Vi vay cong o day bang shell.
          # +100 de chac chan lon hon versionCode 1 cua cac ban APK cu da cai tren may.
          VERSION_CODE=$(( 100 + GITHUB_RUN_NUMBER ))
          ./gradlew generateCodegenArtifactsFromSchema --no-daemon
          ./gradlew :app:createBundleReleaseJsAndAssets --rerun-tasks --no-daemon
          ./gradlew assembleRelease --no-daemon \
            -PappVersionCode="$VERSION_CODE" -PappVersionName="1.1.${GITHUB_RUN_NUMBER}"

      - name: Dat ten APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk landsoft-mobile-1.1.${{ github.run_number }}.apk

      - name: Luu APK de tai xuong
        uses: actions/upload-artifact@v4
        with:
          name: landsoft-mobile-apk-1.1.${{ github.run_number }}
          path: landsoft-mobile-1.1.${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
